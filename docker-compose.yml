services:
  app:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    expose:
      - "8000"
  caddy:
    # Reverse proxy. Gets a free HTTPS certificate automatically when DOMAIN is a real domain.
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped
    depends_on:
      - app
volumes:
  caddy_data:
